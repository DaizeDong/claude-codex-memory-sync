name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - name: Set up Python for profile sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and test dependencies
        shell: powershell
        run: python -m pip install -r requirements-dev.txt
      - name: Test profile sync and rollback
        shell: powershell
        run: python -m pytest tests -q -ra
      - name: Run black-box tests
        shell: powershell
        run: .\tests\run-tests.ps1
