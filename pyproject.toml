[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-codex-memory-sync"
version = "0.3.0"
description = "Ownership-aware Claude to Codex profile adapters"
requires-python = ">=3.11"
dependencies = ["fleet-guards==0.2.1", "skill-smith==0.2.0", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "llmcall>=0.3.1"]

[project.scripts]
profile-sync = "profile_sync:main"
profile-sync-run = "run_profile_sync:main"

[tool.setuptools]
py-modules = ["profile_catalog", "profile_agents", "profile_config", "profile_health", "profile_hooks", "profile_inventory", "profile_lock", "profile_memory", "profile_sync", "run_profile_sync"]

[tool.setuptools.packages.find]
include = ["profile_bridge*"]
